<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação - BROOK STORE</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("GELM_vuWtLrQXSsMn"); // Sua Key
        })();
    </script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .box { background: #111; padding: 30px; border-radius: 15px; border: 2px solid #7c3aed; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(124, 58, 237, 0.3); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #333; background: #000; color: white; box-sizing: border-box; }
        button { background: #7c3aed; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .admin-btn { background: transparent; color: #333; border: none; font-size: 10px; margin-top: 20px; cursor: pointer; }
        #painelAdmin { display: none; margin-top: 20px; border-top: 1px dashed #333; padding-top: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h2 style="color: #7c3aed;">VERIFICAR CÓDIGO</h2>
    <p style="font-size: 14px; color: #ccc;">Insira o código enviado para o seu Gmail</p>
    <input type="text" id="inputCodigo" placeholder="Digite seu código aqui">
    <button onclick="verificar()">VALIDAR ACESSO</button>
    <div id="resultado" style="margin-top: 15px;"></div>

    <button class="admin-btn" onclick="abrirAdmin()">Painel de Liberação</button>

    <div id="painelAdmin">
        <h3 style="color: #22c55e;">LIBERAR CLIENTE</h3>
        <input type="password" id="FRECKLES34" placeholder="Senha do Dono">
        <input type="email" id="emailLiberar" placeholder="Gmail do Cliente">
        <button style="background: #22c55e;" onclick="enviarCodigoManual()">LIBERAR AGORA</button>
    </div>
</div>

<script>
    function verificar() {
        const cod = document.getElementById('inputCodigo').value.trim().toUpperCase();
        const res = document.getElementById('resultado');
        if (cod.startsWith("BROOK") && cod.length > 5) {
            res.innerHTML = "<h3 style='color:#22c55e;'>✅ ACESSO LIBERADO! Mande print no Discord.</h3>";
        } else {
            res.innerHTML = "<span style='color:#ff4444;'>❌ Código Inválido.</span>";
        }
    }

    function abrirAdmin() {
        document.getElementById('painelAdmin').style.display = 'block';
    }

    function enviarCodigoManual() {
        const senha = document.getElementById('senhaAdmin').value;
        const email = document.getElementById('emailLiberar').value;
        
        if (senha !== "SUA_SENHA_AQUI") { // Escolha sua senha!
            alert("Senha incorreta!");
            return;
        }

        const novoCodigo = "BROOK" + Math.floor(1000 + Math.random() * 9000);

        emailjs.send("service_uu69awn", "template_pi9wl0p", {
            v1: novoCodigo,
            to_email: email
        }).then(() => {
            alert("✅ SUCESSO! Código enviado para " + email);
        });
    }
</script>

</body>
</html>
