<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BROOK STORE | OFICIAL</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("GELM_vuWtLrQXSsMn"); })();
    </script>
    <style>
        body { background-color: #050505; color: white; font-family: sans-serif; margin: 0; padding-top: 60px; }
        .banner { background: #7c3aed; text-align: center; padding: 10px; position: fixed; top: 0; width: 100%; font-weight: bold; }
        .container { max-width: 1000px; margin: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; }
        .btn { background: #7c3aed; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="banner">⚡ PROMOÇÃO: 15% DE DESCONTO NO PIX ATIVADO! ⚡</div>
    <div class="container">
        <div class="card"><img src="painel Uriel Xiter.jpg"><h3>PAINEL URIEL</h3><p style="color:#22c55e">R$ 7,50</p><button class="btn">ADQUIRIR</button></div>
        <div class="card"><img src="Auxilio Sleep.jpg"><h3>AUXILIO SLEEP</h3><p style="color:#22c55e">R$ 3,40</p><button class="btn">ADQUIRIR</button></div>
        <div class="card"><img src="holograma hs pescoço.jpg"><h3>HS PESCOÇO</h3><p style="color:#22c55e">R$ 1,70</p><button class="btn">ADQUIRIR</button></div>
        <div class="card"><img src="holograma v2.jpg"><h3>HOLOGRAMA V2</h3><p style="color:#22c55e">R$ 0,85</p><button class="btn">ADQUIRIR</button></div>
    </div>
</body>
</html>
